# -----------------------
# Namespace
# -----------------------
apiVersion: v1
kind: Namespace
metadata:
  name: food-ordering
---
# -----------------------
# App Config
# -----------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: food-ordering
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  JWT_SECRET: "secret"
  JWT_EXPIRATION: "86400000"
---
# -----------------------
# DB Passwords
# -----------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-passwords
  namespace: food-ordering
data:
  AUTH_DB_PASSWORD: "root"
  ORDER_DB_PASSWORD: "root"
  RESTAURANT_DB_PASSWORD: "root"
  PAYMENT_DB_PASSWORD: "root"
  NOTIFICATION_DB_PASSWORD: "root"
---
# -----------------------
# RabbitMQ Config
# -----------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: food-ordering
data:
  USER: "guest"
  PASS: "guest"
---
# -----------------------
# MySQL Deployments + Services
# -----------------------

# AUTH DB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-auth
  namespace: food-ordering
spec:
  selector:
    matchLabels:
      app: mysql-auth
  template:
    metadata:
      labels:
        app: mysql-auth
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: Always
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: db-passwords
                  key: AUTH_DB_PASSWORD
            - name: MYSQL_DATABASE
              value: auth_db
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_PASSWORD
              value: "password"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-auth-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-auth-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-auth
  namespace: food-ordering
spec:
  selector:
    app: mysql-auth
  ports:
    - port: 3306
      targetPort: 3306
---

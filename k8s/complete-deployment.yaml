        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: db-passwords
              key: ORDER_DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: food-ordering
spec:
  selector:
    app: order-service
  ports:
  - port: 8080
    targetPort: 8080
---
# Restaurant Service
apiVersion: apps/v1
